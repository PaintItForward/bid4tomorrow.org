<script>
    // Supabase config
    const SUPABASE_URL = 'https://zezgamocqdkqfaqzompd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplemdhbW9jcWRrcWZhcXpvbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA5NzgsImV4cCI6MjEwMzM0Njk3OH0.Wqvn694Nxg1MtF9orvXeCeNTGN2facW-Lxp5T7qzewQ';
    
    // Initialize Supabase client
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Toast function
    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ... (rest of your code with all `supabase` replaced with `supabaseClient`)

    // Auth check & profile load
    async function checkAuthAndLoadProfile() {
        const { data: { user }, error } = await supabaseClient.auth.getUser();
        if (error || !user) {
            window.location.href = 'login.html?redirect=account.html';
            return;
        }
        
        document.getElementById('avatarDisplay').innerText = user.email?.[0]?.toUpperCase() || 'U';
        document.getElementById('userEmailDisplay').innerText = user.email;
        
        const { data: profile, error: profileError } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single();
            
        if (profileError || !profile) {
            document.getElementById('fullNameInput').value = user.user_metadata?.full_name || '';
            document.getElementById('emailInput').value = user.email || '';
            document.getElementById('createdAtDisplay').value = user.created_at ? new Date(user.created_at).toLocaleDateString() : 'N/A';
        } else {
            document.getElementById('fullNameInput').value = profile.full_name || '';
            document.getElementById('emailInput').value = profile.email || user.email;
            document.getElementById('createdAtDisplay').value = profile.created_at ? new Date(profile.created_at).toLocaleDateString() : 'N/A';
        }
        
        document.getElementById('profileLoading').style.display = 'none';
        document.getElementById('profileForm').style.display = 'block';
    }

    // Update profile
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('fullNameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        
        if (!fullName || !email) {
            showToast('Please fill all fields', 'error');
            return;
        }
        
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;
        
        document.getElementById('saveBtn').disabled = true;
        document.getElementById('saveBtn').textContent = 'Saving...';
        
        const { error } = await supabaseClient
            .from('profiles')
            .upsert({ 
                id: user.id, 
                full_name: fullName, 
                email: email, 
                updated_at: new Date().toISOString() 
            });
            
        if (error) {
            showToast('Update failed: ' + error.message, 'error');
        } else {
            showToast('Profile updated successfully!', 'success');
            document.getElementById('userEmailDisplay').innerText = email;
            document.getElementById('avatarDisplay').innerText = fullName?.[0]?.toUpperCase() || 'U';
        }
        
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtn').textContent = 'Save Changes';
    });

    checkAuthAndLoadProfile();
</script>
