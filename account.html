<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid For Tomorrow — My Account</title>
    <style>
        /* ===== GLOBAL STYLES (shared across pages) ===== */
        :root {
            --crimson: #7D2027;
            --sand-gold: #FAE3B1;
            --ochre-gold: #998731;
            --mahogany: #673C34;
            --bg-light: #fcf9f6;
            --card-light: #ffffff;
            --text-light: #2c2420;
            --border-light: #e7dccc;
            --shadow-light: 0 6px 18px rgba(45, 35, 25, 0.06);
            --bg-dark: #1b1714;
            --card-dark: #2a2420;
            --text-dark: #f3ece4;
            --border-dark: #493f38;
            --shadow-dark: 0 6px 18px rgba(0, 0, 0, 0.35);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }
        h1, h2, h3, h4, .nav-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .container {
            width: min(1200px, 92%);
            margin: 0 auto;
        }
        /* header & nav */
        .site-header {
            background: rgba(253, 246, 238, 0.9);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-light);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 50;
            transition: background 0.3s, border-color 0.3s;
        }
        body.dark-mode .site-header {
            background: rgba(25, 21, 18, 0.9);
            border-bottom-color: var(--border-dark);
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 0;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .nav-logo {
            font-size: 1.8rem;
            color: var(--crimson);
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            font-weight: 500;
        }
        .nav-links a {
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: var(--crimson);
        }
        .cta-button {
            background: var(--crimson);
            color: white;
            padding: 0.5rem 1.3rem;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }
        .cta-button:hover {
            background: var(--mahogany);
        }
        .user-menu {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
        }
        .avatar-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--sand-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--crimson);
        }
        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 50px;
            background: var(--card-light);
            box-shadow: var(--shadow-light);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 0.6rem 0;
            min-width: 200px;
            display: none;
            z-index: 100;
        }
        body.dark-mode .dropdown-menu {
            background: var(--card-dark);
            border-color: var(--border-dark);
            box-shadow: var(--shadow-dark);
        }
        .dropdown-menu.open {
            display: block;
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.7rem 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: inherit;
        }
        .dropdown-item:hover {
            background: #f3e9dc;
        }
        body.dark-mode .dropdown-item:hover {
            background: #3a332d;
        }
        .dark-toggle {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .hamburger {
            display: none;
            font-size: 1.8rem;
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
                padding: 0.5rem 0;
            }
            .nav-links.show {
                display: flex;
            }
            .hamburger {
                display: block;
            }
            .header-inner {
                align-items: center;
            }
        }
        /* cards & buttons */
        .card {
            background: var(--card-light);
            border-radius: 20px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-light);
            padding: 1.8rem;
            transition: background 0.3s, border-color 0.3s;
        }
        body.dark-mode .card {
            background: var(--card-dark);
            border-color: var(--border-dark);
            box-shadow: var(--shadow-dark);
        }
        .btn-primary, .btn-secondary {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: var(--crimson);
            color: white;
        }
        .btn-primary:hover {
            background: var(--mahogany);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--ochre-gold);
            color: var(--ochre-gold);
        }
        .btn-secondary:hover {
            background: var(--sand-gold);
        }
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 10px;
            background: #2c2420;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: 500;
            animation: slideIn 0.3s;
        }
        .toast.success {
            background: #1e7a3c;
        }
        .toast.error {
            background: #b23b3b;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
        }
        .badge-status {
            padding: 0.25rem 0.8rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .winning {
            background: #1e7a3c20;
            color: #1e7a3c;
        }
        .outbid {
            background: #b23b3b20;
            color: #b23b3b;
        }
        .closed {
            background: #88888830;
            color: #666;
        }
        .price {
            font-weight: 700;
            color: var(--crimson);
        }
        /* form */
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: #f9f4ee;
            font-family: inherit;
        }
        body.dark-mode .form-group input {
            background: #3a332d;
            border-color: var(--border-dark);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Shared Header -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="nav-logo">Bid For Tomorrow</a>
            <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
            <nav class="nav-links" id="navLinks">
                <a href="about.html">About Us</a>
                <a href="branches.html">Our Branches</a>
                <a href="auction.html">Fall 26 Auction</a>
                <a href="gallery.html">Gallery</a>
                <a href="events.html">Events</a>
                <a href="how-it-works.html">How It Works</a>
                <a href="impact.html">Impact</a>
                <a href="causes.html">Causes</a>
                <a href="faq.html">FAQ</a>
                <a href="get-involved.html" class="cta-button">Get Involved</a>
            </nav>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <button class="dark-toggle" id="darkToggle" title="Toggle dark mode">🌙</button>
                <div class="user-menu" id="userMenu">
                    <div class="avatar-icon" id="avatarDisplay">U</div>
                    <span id="userNameDisplay" style="font-weight: 600;"></span>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-item" data-link="account.html"><span>👤</span> My Account</div>
                        <div class="dropdown-item" data-link="my-bids.html"><span>👜</span> My Bids</div>
                        <div class="dropdown-item" data-link="winning-bids.html"><span>🏆</span> Winning Bids</div>
                        <div class="dropdown-item" data-link="watchlist.html"><span>❤️</span> Watchlist</div>
                        <div class="dropdown-item" id="signOutBtn"><span>🚪</span> Sign Out</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container" style="flex:1; padding: 2rem 0;">
        <h1 style="margin-bottom: 2rem;">👤 Account Settings</h1>
        <div class="card" style="max-width: 600px;">
            <div id="profileLoading" style="text-align: center; padding: 2rem;">Loading profile...</div>
            <form id="profileForm" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullNameInput" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailInput" required>
                </div>
                <div class="form-group">
                    <label>Member Since</label>
                    <input type="text" id="createdAtDisplay" disabled style="opacity:0.7;">
                </div>
                <button type="submit" class="btn-primary" id="saveBtn">Save Changes</button>
            </form>
            <div id="profileError" style="color: red; margin-top: 1rem;"></div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Supabase config
        const SUPABASE_URL = 'https://zezgamocqdkqfaqzompd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplemdhbW9jcWRrcWZhcXpvbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA5NzgsImV4cCI6MjEwMzM0Njk3OH0.Wqvn694Nxg1MtF9orvXeCeNTGN2facW-Lxp5T7qzewQ';
        const AUCTION_ID = '101afb93-7d37-4276-8602-026acbda56ed';
        
        // Initialize Supabase
        const supabase = window.supabase?.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
        if (!supabase) {
            console.error('Supabase client not loaded');
            document.getElementById('profileError').innerText = 'Supabase not initialized';
        }

        // Toast function
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Dark mode toggle
        const darkToggle = document.getElementById('darkToggle');
        const storedDark = localStorage.getItem('darkMode');
        if (storedDark === 'true') document.body.classList.add('dark-mode');
        darkToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        });

        // Mobile nav
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const navLinks = document.getElementById('navLinks');
        hamburgerBtn.addEventListener('click', () => navLinks.classList.toggle('show'));

        // User menu dropdown
        const userMenu = document.getElementById('userMenu');
        const dropdownMenu = document.getElementById('dropdownMenu');
        userMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('open');
        });
        document.addEventListener('click', () => dropdownMenu.classList.remove('open'));
        document.querySelectorAll('.dropdown-item[data-link]').forEach(item => {
            item.addEventListener('click', () => {
                window.location.href = item.getAttribute('data-link');
            });
        });

        // Auth check & profile load
        async function checkAuthAndLoadProfile() {
            if (!supabase) return;
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = 'login.html?redirect=account.html';
                return;
            }
            document.getElementById('avatarDisplay').innerText = user.email?.[0]?.toUpperCase() || 'U';
            document.getElementById('userNameDisplay').innerText = user.user_metadata?.full_name || user.email;
            
            // Load profile data
            const { data: profile, error: profileError } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();
            if (profileError || !profile) {
                // Create if not exists? handle gracefully
                console.log('Profile not found, using auth data');
                document.getElementById('fullNameInput').value = user.user_metadata?.full_name || '';
                document.getElementById('emailInput').value = user.email || '';
                document.getElementById('createdAtDisplay').value = user.created_at ? new Date(user.created_at).toLocaleDateString() : 'N/A';
            } else {
                document.getElementById('fullNameInput').value = profile.full_name || '';
                document.getElementById('emailInput').value = profile.email || user.email;
                document.getElementById('createdAtDisplay').value = profile.created_at ? new Date(profile.created_at).toLocaleDateString() : 'N/A';
            }
            document.getElementById('profileLoading').style.display = 'none';
            document.getElementById('profileForm').style.display = 'block';
        }

        // Update profile
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullNameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            if (!fullName || !email) {
                showToast('Please fill all fields', 'error');
                return;
            }
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;
            document.getElementById('saveBtn').disabled = true;
            // Upsert profile
            const { error } = await supabase
                .from('profiles')
                .upsert({ id: user.id, full_name: fullName, email: email, updated_at: new Date() });
            if (error) {
                showToast('Update failed: ' + error.message, 'error');
                document.getElementById('saveBtn').disabled = false;
            } else {
                showToast('Profile updated successfully!', 'success');
                document.getElementById('saveBtn').disabled = false;
                // Update navbar name
                document.getElementById('userNameDisplay').innerText = fullName;
            }
        });

        // Sign out
        document.getElementById('signOutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        // Initial load
        checkAuthAndLoadProfile();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
