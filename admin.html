<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin — Bid For Tomorrow</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .overview-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin: 1rem 0 2rem; }
    .overview-card { background:#fff; border:1px solid #e3e3e6; border-radius:8px; padding:1rem; }
    .overview-card-value { font-size:1.8rem; font-weight:600; }
    .overview-card-label { color:#666; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; margin-top:.25rem; }
    #overview-auction-statuses { padding-left:1.2rem; line-height:1.6; }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="admin-checking" class="admin-panel">Checking authorization…</div>

  <div id="admin-denied" class="admin-panel" hidden>
    <h1>Not authorized</h1>
    <p id="admin-denied-reason">You must sign in with an administrator account to view this page.</p>
    <p><a href="login.html">Sign in</a></p>
  </div>

  <div id="admin-shell" hidden>
    <header class="admin-header">
      <h1>Bid For Tomorrow — Admin</h1>
      <div class="admin-header-right">
        <span id="admin-email" class="admin-muted"></span>
        <button id="admin-signout" type="button">Sign out</button>
      </div>
    </header>

    <nav class="admin-tabs" id="admin-tabs">
      <!-- Tabs added in the next step (Overview, Auctions, Bids, Winners, Consents) -->
    </nav>

    <main id="admin-main" class="admin-main">
      <section id="admin-view-overview" class="admin-view">
        <h2>Overview</h2>
        <div id="overview-cards" class="overview-cards">Loading…</div>
        <h3>Auction counts by status</h3>
        <ul id="overview-auction-statuses"><li class="admin-muted">Loading…</li></ul>
        <p class="admin-muted" id="overview-note"></p>
      </section>
    </main>
  </div>

  <script>
    // ---- CONFIG ----
    const supabaseUrl = 'https://zezgamocqdkqfaqzompd.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplemdhbW9jcWRrcWZhcXpvbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA5NzgsImV4cCI6MjEwMzM0Njk3OH0.Wqvn694Nxg1MtF9orvXeCeNTGN2facW-Lxp5T7qzewQ';

    // Single client, named `sb` so it does not collide with the library's global `supabase`.
    const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

    const el = (id) => document.getElementById(id);
    const show = (id) => { el(id).hidden = false; };
    const hide = (id) => { el(id).hidden = true; };

    // ---------- helpers ----------
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function overviewCard(label, value) {
      return `<div class="overview-card"><div class="overview-card-value">${esc(value)}</div>` +
             `<div class="overview-card-label">${esc(label)}</div></div>`;
    }

    // ---------- view state ----------
    function setChecking() {
      hide("admin-denied"); hide("admin-shell"); show("admin-checking");
    }
    function setDenied(reason) {
      hide("admin-checking"); hide("admin-shell");
      el("admin-denied-reason").textContent = reason; show("admin-denied");
    }
    function setAuthorized(email) {
      hide("admin-checking"); hide("admin-denied");
      el("admin-email").textContent = email || "";
      show("admin-shell");
      // fire-and-forget; errors are surfaced inside loadOverview
      loadOverview();
    }

    // ---------- overview (read-only) ----------
    async function loadOverview() {
      const cards = el("overview-cards");
      const statusList = el("overview-auction-statuses");
      const note = el("overview-note");
      if (!cards) return; // overview section not present

      const errors = [];
      let auctions = null;
      const counts = { lots: null, bids: null, artworks: null, winners: null };

      try {
        const { data, error } = await sb.from("auctions").select("*");
        if (error) throw error;
        auctions = data || [];
        if (auctions[0]) console.info("[schema] auctions columns:", Object.keys(auctions[0]));
      } catch (e) { errors.push("auctions: " + e.message); }

      for (const table of ["lots", "bids", "artworks", "winners"]) {
        try {
          const { count, error } = await sb
            .from(table).select("*", { count: "exact", head: true });
          if (error) throw error;
          counts[table] = count ?? 0;
        } catch (e) { errors.push(`${table}: ${e.message}`); }

        try {
          const probe = await sb.from(table).select("*").limit(1);
          if (!probe.error && probe.data && probe.data[0]) {
            console.info(`[schema] ${table} columns:`, Object.keys(probe.data[0]));
          }
        } catch (_) { /* probe is best-effort */ }
      }

      cards.innerHTML = [
        overviewCard("Auctions", auctions ? auctions.length : "?"),
        overviewCard("Lots", counts.lots ?? "?"),
        overviewCard("Bids", counts.bids ?? "?"),
        overviewCard("Artworks", counts.artworks ?? "?"),
        overviewCard("Winners", counts.winners ?? "?"),
      ].join("");

      if (Array.isArray(auctions) && auctions.length) {
        const tally = {};
        for (const a of auctions) {
          const key = ("status" in a) ? String(a.status) : "(no status column)";
          tally[key] = (tally[key] || 0) + 1;
        }
        statusList.innerHTML = Object.entries(tally)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([k, v]) => `<li>${esc(k)} — <strong>${v}</strong></li>`)
          .join("");
      } else if (auctions) {
        statusList.innerHTML = `<li class="admin-muted">No auctions yet.</li>`;
      } else {
        statusList.innerHTML = `<li class="admin-muted">Could not load.</li>`;
      }

      if (note) {
        note.textContent = errors.length
          ? "Partial data — errors: " + errors.join("; ")
          : "All counts loaded from live database.";
      }
    }

    // ---------- admin resolution ----------
    async function resolveAdminStatus(user) {
      try {
        const { data, error } = await sb.rpc("is_admin");
        if (!error && typeof data === "boolean") {
          console.info("[admin] is_admin() ->", data);
          return data;
        }
        if (error) console.warn("[admin] is_admin() error:", error.message);
      } catch (e) { console.warn("[admin] is_admin() threw:", e); }

      try {
        const { data, error } = await sb
          .from("admins").select("*").eq("user_id", user.id).maybeSingle();
        if (error) { console.warn("[admin] admins select error:", error.message); return false; }
        console.info("[admin] admins row ->", data);
        return !!data;
      } catch (e) { console.warn("[admin] admins select threw:", e); return false; }
    }

    // ---------- boot ----------
    async function boot() {
      setChecking();
      const { data: { session }, error } = await sb.auth.getSession();
      if (error || !session) { setDenied("You are not signed in."); return; }
      const user = session.user;
      const isAdmin = await resolveAdminStatus(user);
      if (!isAdmin) { setDenied("This account does not have administrator access."); return; }
      setAuthorized(user.email);
      sb.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_OUT" || !session) setDenied("Your session has ended. Please sign in again.");
      });
    }

    el("admin-signout")?.addEventListener("click", async () => {
      await sb.auth.signOut();
      setDenied("You have been signed out.");
    });

    document.addEventListener("DOMContentLoaded", boot);
  </script>
  
  
</body>
</html>
