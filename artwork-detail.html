<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase configuration
  const supabaseUrl = 'https://zezgamocqdkqfaqzompd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplemdhbW9jcWRrcWZhcXpvbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA5NzgsImV4cCI6MjEwMzM0Njk3OH0.Wqvn694Nxg1MtF9orvXeCeNTGN2facW-Lxp5T7qzewQ';
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  const FALL_2026_AUCTION_ID = '101afb93-7d37-4276-8602-026acbda56ed';
  
  let currentUser = null;
  let currentLot = null;
  
  // Check auth
  async function checkAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    currentUser = session?.user || null;
    return currentUser;
  }
  
  // Fetch lot details
  async function fetchLotDetails(lotId) {
    try {
      // Get lot
      const { data: lot, error: lotError } = await supabaseClient
        .from('lots')
        .select('*')
        .eq('id', lotId)
        .single();
      
      if (lotError) throw lotError;
      
      // Get artwork
      let artwork = null;
      if (lot.artwork_id) {
        const { data: artData } = await supabaseClient
          .from('artworks')
          .select('*')
          .eq('id', lot.artwork_id)
          .single();
        artwork = artData;
      }
      
      // Get artist
      let artist = null;
      if (artwork?.artist_id) {
        const { data: artistData } = await supabaseClient
          .from('artists')
          .select('*')
          .eq('id', artwork.artist_id)
          .single();
        artist = artistData;
      }
      
      // Get bids
      const { data: bids } = await supabaseClient
        .from('bids')
        .select('*')
        .eq('lot_id', lotId)
        .order('amount', { ascending: false });
      
      currentLot = {
        ...lot,
        artwork,
        artist,
        bids: bids || []
      };
      
      return currentLot;
    } catch (error) {
      console.error('Error fetching lot:', error);
      return null;
    }
  }
  
  // Get bidder names
  async function getBidderNames(bidderIds) {
    const names = {};
    try {
      const { data: profilesData } = await supabaseClient
        .from('profiles')
        .select('id, full_name')
        .in('id', bidderIds);
      
      if (profilesData) {
        profilesData.forEach(p => {
          names[p.id] = p.full_name;
        });
      }
    } catch (e) {
      console.warn('Profiles table not available');
    }
    
    // Fallback names
    for (const id of bidderIds) {
      if (!names[id]) {
        names[id] = 'Bidder ' + (id ? id.substring(0, 4).toUpperCase() : 'Unknown');
      }
    }
    
    return names;
  }
  
  // Place bid
  async function placeBid(amount) {
    if (!currentUser) {
      alert('Please login to place a bid');
      window.location.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`;
      return;
    }
    
    const minRequired = currentLot.bids[0]?.amount 
      ? currentLot.bids[0].amount + (currentLot.bid_increment || 10)
      : currentLot.starting_bid;
    
    if (amount < minRequired) {
      alert(`Minimum bid is $${minRequired}`);
      return;
    }
    
    const { data, error } = await supabaseClient
      .from('bids')
      .insert([{
        lot_id: currentLot.id,
        bidder_id: currentUser.id,
        amount: amount
      }])
      .select()
      .single();
    
    if (error) {
      alert('Error placing bid: ' + error.message);
      return;
    }
    
    // Refresh lot data
    await init();
    alert('Bid placed successfully!');
  }
  
  // Initialize page
  async function init() {
    await checkAuth();
    
    const params = new URLSearchParams(window.location.search);
    const lotId = params.get('lot_id') || params.get('id');
    
    if (!lotId) {
      document.body.innerHTML = '<p>No lot specified. <a href="auction.html">Go to auction</a></p>';
      return;
    }
    
    const lot = await fetchLotDetails(lotId);
    if (!lot) {
      document.body.innerHTML = '<p>Lot not found. <a href="auction.html">Go to auction</a></p>';
      return;
    }
    
    // Populate page
    document.getElementById('artImage').src = lot.artwork?.image_url || '';
    document.getElementById('artTitle').textContent = lot.artwork?.title || 'Untitled';
    document.getElementById('artArtist').textContent = lot.artist?.name || 'Unknown Artist';
    document.getElementById('artMedium').textContent = lot.artwork?.medium || '—';
    document.getElementById('artDimensions').textContent = lot.artwork?.dimensions || '—';
    document.getElementById('artStatement').textContent = lot.artwork?.description || 'No description.';
    document.getElementById('artStartBid').textContent = `$${lot.starting_bid}`;
    
    const currentBid = lot.bids[0]?.amount || lot.starting_bid;
    const minBid = lot.bids[0]?.amount 
      ? lot.bids[0].amount + (lot.bid_increment || 10)
      : lot.starting_bid;
    
    document.getElementById('currentBid').textContent = `$${currentBid}`;
    document.getElementById('minBid').textContent = `$${minBid}`;
    document.getElementById('bidCount').textContent = lot.bids.length;
    document.getElementById('bidInput').min = minBid;
    document.getElementById('bidInput').value = minBid;
    
    // Status
    if (lot.status === 'closed' || lot.status === 'sold') {
      document.getElementById('statusBadge').textContent = 'Auction Closed';
      document.getElementById('bidFormWrap').style.display = 'none';
      document.getElementById('closedMsg').style.display = 'block';
      document.getElementById('winningBidText').textContent = `Winning bid: $${currentBid}`;
    } else if (lot.status === 'open') {
      document.getElementById('statusBadge').textContent = 'Live Auction';
    } else {
      document.getElementById('statusBadge').textContent = 'Preview';
      document.getElementById('bidFormWrap').style.display = 'none';
    }
    
    // Bid history
    const historyEl = document.getElementById('bidHistory');
    historyEl.innerHTML = '';
    
    if (lot.bids.length > 0) {
      const bidderIds = [...new Set(lot.bids.map(b => b.bidder_id))];
      const bidderNames = await getBidderNames(bidderIds);
      
      lot.bids.forEach(bid => {
        const li = document.createElement('li');
        const bidderName = bid.bidder_id === currentUser?.id 
          ? 'You' 
          : (bidderNames[bid.bidder_id] || 'Anonymous');
        const time = new Date(bid.created_at).toLocaleString();
        li.innerHTML = `<span class="amount">$${bid.amount}</span><span>${bidderName}</span><span class="time">${time}</span>`;
        historyEl.appendChild(li);
      });
    } else {
      historyEl.innerHTML = '<li>No bids yet</li>';
    }
    
    // Bid button
    document.getElementById('placeBidBtn').addEventListener('click', () => {
      const amount = parseInt(document.getElementById('bidInput').value);
      if (amount >= minBid) {
        if (confirm(`Place bid of $${amount}?`)) {
          placeBid(amount);
        }
      } else {
        alert(`Minimum bid is $${minBid}`);
      }
    });
  }
  
  // Run when DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
