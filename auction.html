<html lang="en">
  
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fall '26 Auction · Bid For Tomorrow</title>
  <meta name="description" content="Preview the original student artworks featured in Bid For Tomorrow's Fall 2026 charity auction." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       VARIABLES & THEMES (exact match to existing Bid For Tomorrow site)
       ========================================================================== */
    :root {
      --sand-gold:          #FAE3B1;
      --sand-gold-light:    #FCF1D9;
      --sand-gold-tint:     #FDF7EB;
      --ochre-gold:         #998731;
      --ochre-gold-dark:    #7D6D24;
      --ochre-gold-light:   #E9DCA6;
      --terracotta:         #CF5527;
      --terracotta-dark:    #A83E17;
      --terracotta-light:   #F39875;
      --crimson:            #7D2027;
      --crimson-dark:       #5C141A;
      --crimson-light:      #A93C44;
      --mahogany:           #673C34;
      --mahogany-dark:      #4D2B24;
      --mahogany-mid:       #7F4C43;
      --mahogany-light:     #AB7A71;
      --cerulean:           #5FA8C2;
      --cerulean-dark:      #3B829C;
      --cerulean-light:     #D4EDF5;

      --cream:              #FAE3B1;
      --cream-alt:          #F5DC9F;
      --white:              #FCF6EC;
      --border:             #998731;
      --border-subtle:      rgba(153, 135, 49, 0.35);

      --radius-sm:          2px;
      --radius-md:          4px;
      --radius-lg:          8px;
      --shadow-sm:          0 2px 8px rgba(103, 60, 52, 0.06);
      --shadow-md:          0 8px 24px rgba(103, 60, 52, 0.1);
      --shadow-lg:          0 20px 48px rgba(103, 60, 52, 0.14);

      --text-heading:       #4E2922;
      --text-body:          #59322B;
      --text-muted:         #83544C;
      --card-bg:            #FCF6EC;
      --section-alt:        #F6DEAA;
      --input-bg:           #FFFFFF;
      --nav-bg:             rgba(250, 227, 177, 0.96);

      --hero-bg-base:       #FCF3DF;
      --hero-gradient-start:#FDF8EC;
      --hero-gradient-mid:  #FAECBD;
      --hero-tag-bg:        rgba(153, 135, 49, 0.14);
      --hero-tag-border:    #998731;
      --hero-tag-text:      #673C34;
    }

    .dark {
      --cream:              #180B09;
      --cream-alt:          #2A1612;
      --white:              #261310;
      --border:             #998731;
      --border-subtle:      rgba(153, 135, 49, 0.45);
      --text-heading:       #FAE3B1;
      --text-body:          #F3E3CE;
      --text-muted:         #D6C2AC;
      --card-bg:            #2C1713;
      --section-alt:        #23120F;
      --input-bg:           #22110E;
      --nav-bg:             rgba(38, 20, 16, 0.97);
      --hero-bg-base:       #180B09;
      --hero-gradient-start:#120705;
      --hero-gradient-mid:  #200D0B;
      --hero-tag-bg:        rgba(153, 135, 49, 0.2);
      --hero-tag-border:    #998731;
      --hero-tag-text:      #FAE3B1;
      --shadow-sm:          0 2px 8px rgba(0, 0, 0, 0.4);
      --shadow-md:          0 8px 24px rgba(0, 0, 0, 0.6);
      --shadow-lg:          0 20px 48px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--cream);
      color: var(--text-body);
      line-height: 1.65;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--text-heading);
      letter-spacing: -0.02em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .btn-primary {
      background-color: var(--crimson);
      color: var(--white);
    }
    .btn-primary:hover {
      background-color: var(--crimson-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(125, 32, 39, 0.25);
    }

    .btn-outline {
      border-color: var(--border);
      background-color: transparent;
      color: var(--text-heading);
    }
    .btn-outline:hover {
      background-color: var(--cream-alt);
      border-color: var(--crimson);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover {
      color: var(--text-heading);
      background-color: var(--cream-alt);
    }

    .btn-disabled {
      opacity: 0.6;
      pointer-events: none;
      cursor: default;
    }

    /* ==========================================================================
       NAVIGATION
       ========================================================================== */
    #main-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 1.35rem;
      color: var(--crimson);
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .dark .nav-logo {
      color: var(--sand-gold);
    }

    .nav-logo-mark {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--crimson);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      list-style: none;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--crimson);
    }
    .dark .nav-links a:hover {
      color: var(--sand-gold);
    }

    .nav-links a.active {
      color: var(--ochre-gold);
      font-weight: 700;
    }

    .nav-cta {
      padding: 0.6rem 1.25rem;
      background: var(--crimson);
      color: var(--white) !important;
      border-radius: var(--radius-sm);
      transition: background-color 0.2s ease;
    }
    .nav-cta:hover {
      background: var(--crimson-dark);
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      flex-direction: column;
      gap: 5px;
    }
    .nav-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: var(--text-heading);
      transition: 0.2s;
    }

    @media (max-width: 960px) {
      .nav-toggle { display: flex; }
      .nav-links {
        display: none;
        position: absolute;
        top: 76px;
        left: 0;
        right: 0;
        background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        padding: 1.5rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        box-shadow: var(--shadow-md);
      }
      .nav-links.open { display: flex; }
    }

    .dark-toggle {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-heading);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 99;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .dark-toggle:hover {
      transform: scale(1.08);
    }

    /* User menu styles */
    .user-menu {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-heading);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .user-menu:hover {
      border-color: var(--crimson);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ochre-gold);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .user-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.5rem;
      min-width: 200px;
      box-shadow: var(--shadow-lg);
      display: none;
      z-index: 60;
    }

    .user-dropdown.show {
      display: block;
    }

    .user-dropdown-item {
      display: block;
      width: 100%;
      padding: 0.6rem 1rem;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-body);
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .user-dropdown-item:hover {
      background: var(--cream-alt);
      color: var(--text-heading);
    }

    /* ==========================================================================
       HERO
       ========================================================================== */
    .auction-hero {
      position: relative;
      padding: 4rem 0 3rem 0;
      text-align: center;
      background: linear-gradient(180deg, var(--hero-gradient-mid) 0%, var(--hero-bg-base) 100%);
      border-bottom: 1px solid var(--border-subtle);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--hero-tag-bg);
      border: 1px solid var(--hero-tag-border);
      color: var(--hero-tag-text);
      margin-bottom: 1.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .auction-hero h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.15;
      font-weight: 600;
      margin-bottom: 0.75rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .auction-hero p {
      font-size: clamp(1rem, 1.6vw, 1.1rem);
      max-width: 680px;
      margin: 0 auto 2rem auto;
      color: var(--text-body);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .auction-status-banner {
      display: inline-block;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.8rem 2rem;
      box-shadow: var(--shadow-sm);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-heading);
    }
    .auction-status-banner span {
      color: var(--terracotta);
      margin-left: 0.5rem;
    }

    /* ==========================================================================
       AUCTION LISTING
       ========================================================================== */
    .auction-listing-section {
      padding: 3rem 0 5rem 0;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .section-header h2 {
      font-size: 2rem;
      font-weight: 700;
    }
    .section-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .controls-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .search-box {
      position: relative;
      min-width: 220px;
    }
    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text-heading);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s ease;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .search-box input:focus {
      border-color: var(--ochre-gold);
    }
    .search-box svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      stroke: var(--text-muted);
    }

    select#sortSelect {
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text-heading);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .chip {
      padding: 0.35rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .chip:hover {
      border-color: var(--ochre-gold);
      color: var(--text-heading);
    }
    .chip.active {
      background: var(--ochre-gold);
      color: var(--white);
      border-color: var(--ochre-gold);
    }

    /* ==========================================================================
       LOT GRID
       ========================================================================== */
    .lot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .lot-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .lot-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--crimson);
    }

    .lot-image-wrap {
      height: 220px;
      overflow: hidden;
      position: relative;
      background: var(--section-alt);
    }
    .lot-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .lot-card:hover .lot-image-wrap img {
      transform: scale(1.05);
    }

    .lot-number-badge {
      position: absolute;
      top: 0.85rem;
      left: 0.85rem;
      padding: 0.25rem 0.75rem;
      background: var(--mahogany-dark);
      color: var(--sand-gold);
      font-size: 0.78rem;
      font-weight: 700;
      font-family: monospace;
      border-radius: var(--radius-sm);
      z-index: 5;
      letter-spacing: 0.5px;
    }

    .lot-branch-badge {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      padding: 0.2rem 0.65rem;
      background: var(--sand-gold);
      color: var(--crimson);
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      z-index: 5;
      box-shadow: var(--shadow-sm);
    }
    .dark .lot-branch-badge {
      background: var(--mahogany-dark);
      color: var(--sand-gold);
    }

    .lot-body {
      padding: 1.25rem 1.5rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .lot-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.1rem;
      line-height: 1.25;
    }

    .lot-artist {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ochre-gold);
      margin-bottom: 0.4rem;
    }

    .lot-details {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 1rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .lot-details span {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .lot-details .label {
      color: var(--text-body);
      font-weight: 600;
    }

    .lot-starting-bid {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 1rem;
    }
    .lot-starting-bid small {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .lot-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-subtle);
    }

    .lot-actions .btn {
      flex: 1;
      justify-content: center;
    }

    /* ==========================================================================
       DETAIL MODAL
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(24, 11, 9, 0.8);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2rem 2.25rem 2.25rem 2.25rem;
      width: 100%;
      max-width: 720px;
      position: relative;
      box-shadow: var(--shadow-lg);
      animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }
    .modal-close-btn:hover {
      color: var(--text-heading);
      background-color: var(--section-alt);
    }

    .modal-lot-number {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ochre-gold);
      margin-bottom: 0.2rem;
    }

    .modal-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
    }

    .modal-artist {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ochre-gold);
      margin-bottom: 1rem;
    }

    .modal-image-wrap {
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 1.25rem;
      background: var(--section-alt);
      max-height: 340px;
    }
    .modal-image-wrap img {
      width: 100%;
      height: 100%;
      max-height: 340px;
      object-fit: cover;
    }

    .modal-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1.5rem;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }
    .modal-info-grid .info-label {
      color: var(--text-muted);
      font-weight: 600;
    }
    .modal-info-grid .info-value {
      color: var(--text-heading);
      font-weight: 500;
    }

    .modal-description {
      font-size: 0.9rem;
      color: var(--text-body);
      line-height: 1.6;
      margin-bottom: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-subtle);
    }

    /* Auction panel inside modal */
    .auction-panel {
      background: var(--section-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .auction-panel .panel-left {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .auction-panel .panel-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }
    .auction-panel .panel-value {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-heading);
    }
    .auction-panel .panel-status {
      font-weight: 700;
      color: var(--terracotta);
    }
    .auction-panel .panel-btn {
      min-width: 140px;
    }

    /* bid history */
    .bid-history {
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 0.5rem 0;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border-subtle);
    }

    .bid-entry {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .bid-entry:last-child {
      border-bottom: none;
    }

    /* ==========================================================================
       TOAST
       ========================================================================== */
    .toast-banner {
      position: fixed;
      top: 90px;
      right: 1.5rem;
      z-index: 110;
      background: var(--card-bg);
      border: 1px solid var(--terracotta);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.25rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      max-width: 400px;
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast-banner .toast-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--terracotta);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
      font-size: 0.9rem;
    }

    .toast-banner .toast-body {
      flex-grow: 1;
    }
    .toast-banner .toast-body .toast-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-heading);
    }
    .toast-banner .toast-body .toast-msg {
      font-size: 0.8rem;
      color: var(--text-body);
    }

    .toast-close {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
      padding: 0 0.25rem;
    }
    .toast-close:hover {
      color: var(--text-heading);
    }

    /* ==========================================================================
       FOOTER
       ========================================================================== */
    .auction-footer {
      border-top: 1px solid var(--border);
      padding: 3rem 0;
      text-align: center;
      background: var(--cream-alt);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .dark .auction-footer {
      background: var(--section-alt);
    }
    .auction-footer a {
      color: var(--text-heading);
      text-decoration: underline;
      font-weight: 600;
    }

    /* ==========================================================================
       RESPONSIVE
       ========================================================================== */
    @media (max-width: 640px) {
      .modal-card {
        padding: 1.25rem;
      }
      .modal-info-grid {
        grid-template-columns: 1fr;
        gap: 0.25rem;
      }
      .auction-panel {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .lot-grid {
        grid-template-columns: 1fr;
      }
      .section-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .controls-tools {
        width: 100%;
      }
      .search-box {
        flex: 1;
        min-width: 140px;
      }
    }

    .modal-card::-webkit-scrollbar {
      width: 4px;
    }
    .modal-card::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-card::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* ===== LAZY LOAD PLACEHOLDER ===== */
    img.lazy {
      background: var(--section-alt);
    }
    img.lazy:not([src]) {
      opacity: 0;
    }
    img.lazy[src] {
      opacity: 1;
      transition: opacity 0.3s;
    }
  </style>
</head>
