<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="manifest" href="/site.webmanifest" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint It Forward</title>
<meta name="description" content="Paint It Forward is a student-led initiative using art to support youth, health, and community causes across the Greater Toronto Area.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --matcha:             #7A9E7E;
    --matcha-dark:        #5F7F63;
    --soft-matcha:        #B8C9A3;
    --soft-matcha-light:  #DDE8D4;
    --beige:              #DCCBB8;
    --beige-light:        #EDE4D8;
    --cream:              #F7F3EC;
    --white:              #FDFBF8;
    --espresso:           #3E302A;
    --espresso-mid:       #6B5A52;
    --espresso-light:     #A08070;
    --border:             #E0D8CE;
    --radius-sm: 6px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 2px 12px rgba(62,48,42,0.07);
    --shadow-md: 0 8px 32px rgba(62,48,42,0.11);
    --shadow-lg: 0 20px 60px rgba(62,48,42,0.15);
    --transition: 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    --text-heading:   #3E302A;
    --text-body:      #6B5A52;
    --text-muted:     #A08070;
    --text-on-light:  #3E302A;
    --card-bg:        #FDFBF8;
    --card-border:    #E0D8CE;
    --section-alt:    #EDE4D8;
    --section-green:  #DDE8D4;
    --involved-1-bg:  #DDE8D4;
    --involved-2-bg:  #EDE4D8;
    --involved-3-bg:  #EAF0E5;
    --involved-4-bg:  #F0EBE5;
    --involved-border-1: rgba(184,201,163,0.6);
    --involved-border-2: rgba(220,203,184,0.6);
    --involved-border-3: rgba(180,205,170,0.5);
    --involved-border-4: rgba(220,210,200,0.5);
    --input-bg:       #FDFBF8;
    --input-border:   #E0D8CE;
    --input-text:     #3E302A;
    --contact-bg:     #F7F3EC;
    --footer-text:    rgba(255,255,255,0.38);
    --footer-link:    rgba(255,255,255,0.5);
    --nav-bg:         rgba(247,243,236,0.94);
  }

  body.dark {
    --cream:              #1C1812;
    --white:              #231E18;
    --beige-light:        #2A2318;
    --beige:              #2E261A;
    --border:             #3D3025;
    --text-heading:       #F0E8DF;
    --text-body:          #B8A898;
    --text-muted:         #806A58;
    --text-on-light:      #F0E8DF;
    --card-bg:            #231E18;
    --card-border:        #3D3025;
    --section-alt:        #211C14;
    --section-green:      #1C2418;
    --involved-1-bg:      #1C2A1C;
    --involved-2-bg:      #2A2418;
    --involved-3-bg:      #1E2A1C;
    --involved-4-bg:      #2A201A;
    --involved-border-1:  rgba(80,120,80,0.4);
    --involved-border-2:  rgba(120,100,70,0.4);
    --involved-border-3:  rgba(80,120,80,0.4);
    --involved-border-4:  rgba(120,100,80,0.4);
    --input-bg:           #1C1812;
    --input-border:       #3D3025;
    --input-text:         #F0E8DF;
    --contact-bg:         #231E18;
    --nav-bg:             rgba(28,24,18,0.96);
    --soft-matcha-light:  #253020;
    --espresso:           #F0E8DF;
    --espresso-mid:       #B8A898;
    --espresso-light:     #806A58;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; font-size: 16px; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    color: var(--text-heading);
    background: var(--cream);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  h1, h2, h3, h4 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.015em;
    color: var(--text-heading);
  }
  h1 { font-size: clamp(2.8rem, 6vw, 5.5rem); }
  h2 { font-size: clamp(1.9rem, 3.5vw, 3rem); }
  h3 { font-size: clamp(1.2rem, 2vw, 1.6rem); }

  p {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 1rem;
    line-height: 1.75;
    color: var(--text-body);
    font-weight: 400;
  }

  .eyebrow {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--matcha);
    display: block;
    margin-bottom: 0.9rem;
  }

  /* ── NAVIGATION ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    padding: 0 2.5rem;
    background: var(--nav-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--card-border);
    transition: background var(--transition), border-color var(--transition);
  }

  .nav-inner {
    max-width: 1320px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 70px;
  }

  .nav-logo {
    display: flex; align-items: center; gap: 0.65rem;
    text-decoration: none; color: var(--text-heading);
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem; font-weight: 600; flex-shrink: 0;
    transition: color var(--transition);
  }

  .nav-logo-mark {
    width: 36px; height: 36px; border-radius: 50%;
    overflow: hidden; background: var(--soft-matcha-light);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background var(--transition);
  }
  .nav-logo-mark svg { width: 18px; height: 18px; fill: var(--matcha-dark); }

  .nav-links { display: flex; align-items: center; gap: 0.2rem; list-style: none; }
  .nav-links a {
    text-decoration: none; color: var(--text-body);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.85rem; font-weight: 500;
    padding: 0.4rem 0.8rem; border-radius: 5px;
    transition: color var(--transition), background var(--transition);
  }
  .nav-links a:hover { color: var(--text-heading); background: var(--beige-light); }
  .nav-cta {
    background: var(--espresso) !important;
    color: var(--cream) !important;
    padding: 0.45rem 1.1rem !important;
    border-radius: 4px !important; font-weight: 600 !important;
  }
  body.dark .nav-cta { background: var(--matcha) !important; color: white !important; }
  .nav-cta:hover { background: var(--matcha-dark) !important; color: white !important; }

  .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 0.4rem; }
  .nav-toggle span { display: block; width: 22px; height: 1.5px; background: var(--text-heading); margin: 5px 0; border-radius: 2px; transition: var(--transition); }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.8rem 1.6rem; border-radius: 4px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.875rem; font-weight: 600;
    text-decoration: none; cursor: pointer; border: none;
    letter-spacing: 0.03em; transition: var(--transition);
  }
  .btn-primary { background: var(--matcha); color: white; }
  .btn-primary:hover { background: var(--matcha-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(122,158,126,0.35); }
  .btn-dark { background: var(--espresso); color: white; }
  body.dark .btn-dark { background: var(--matcha); color: white; }
  .btn-dark:hover { background: var(--matcha-dark); transform: translateY(-1px); }
  .btn-outline { background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.55); }
  .btn-outline:hover { background: rgba(255,255,255,0.12); border-color: white; }
  .btn-ghost {
    background: rgba(255,255,255,0.55); color: var(--text-heading);
    border: 1.5px solid var(--card-border);
  }
  body.dark .btn-ghost { background: rgba(255,255,255,0.08); color: var(--text-heading); border-color: var(--card-border); }
  .btn-ghost:hover { background: var(--card-bg); border-color: var(--text-heading); transform: translateY(-1px); }

  /* ── LAYOUT ── */
  .container { max-width: 1280px; margin: 0 auto; padding: 0 2.5rem; }
  .section    { min-height: 100vh; display: flex; align-items: center; padding: 110px 0; }
  .section-sm { min-height: 50vh; display: flex; align-items: center; padding: 72px 0; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh; background: #2A1E18;
    position: relative; overflow: hidden;
    display: flex; align-items: center; padding-top: 70px;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: linear-gradient(140deg, #2A1E18 0%, #3E302A 40%, #5F7F63 100%);
    opacity: 0.95;
  }
  .hero-blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.22; animation: blobFloat 9s ease-in-out infinite; }
  .hero-blob-1 { width: 550px; height: 550px; background: var(--soft-matcha); top: -120px; right: -80px; animation-delay: 0s; }
  .hero-blob-2 { width: 400px; height: 400px; background: var(--beige); bottom: -80px; left: 8%; animation-delay: 3s; }
  @keyframes blobFloat { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(18px,-25px) scale(1.04);} }

  .hero-content { position: relative; z-index: 2; padding: 8rem 2.5rem 7rem; max-width: 1280px; margin: 0 auto; width: 100%; }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
    padding: 0.35rem 0.9rem;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.65);
    letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 2rem;
  }
  .hero h1 { color: white; max-width: 820px; margin-bottom: 1.5rem; }
  .hero h1 em { font-style: italic; color: var(--soft-matcha); }
  .hero-sub { font-size: 1.1rem; color: rgba(255,255,255,0.55); max-width: 520px; margin-bottom: 2.5rem; line-height: 1.75; }
  .hero-buttons { display: flex; flex-wrap: wrap; gap: 0.9rem; margin-bottom: 5rem; }
  .hero-rule { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 3rem; }
  .hero-stats { display: flex; flex-wrap: wrap; gap: 3.5rem; }
  .hero-stat-num { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 600; color: white; line-height: 1; margin-bottom: 0.3rem; }
  .hero-stat-label { font-size: 0.78rem; color: rgba(255,255,255,0.4); font-weight: 400; letter-spacing: 0.04em; }

  /* ── GALLERY ── */
  .gallery-section {
    background: var(--white);
    transition: background var(--transition);
  }

  .gallery-section .section-header {
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .artwork-carousel {
    position: relative;
    display: flex;
    align-items: center;
    gap: 1rem;
    max-width: 1000px;
    margin: 0 auto;
  }

  .carousel-window {
    flex: 1;
    overflow: hidden;
    border-radius: var(--radius-lg);
  }

  .carousel-track {
    display: flex;
    transition: transform 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  .artwork-slide {
    min-width: 100%;
    display: grid;
    grid-template-columns: 420px 1fr;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: background var(--transition), border-color var(--transition);
  }

  .artwork-image {
    background: var(--section-alt);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    transition: background var(--transition);
  }

  .artwork-image img {
    width: 100%;
    height: 420px;
    object-fit: contain;
    border-radius: var(--radius-sm);
  }

  .artwork-details {
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .artwork-details h3 {
    font-size: 2rem;
    margin-bottom: 0.75rem;
  }

  .artist {
    font-weight: 600;
    color: var(--matcha-dark);
    margin-bottom: 0.25rem;
    font-size: 1rem;
  }

  .medium {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 1.25rem;
  }

  .artwork-description {
    color: var(--text-body);
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  .status-badge {
    display: inline-block;
    background: rgba(122,158,126,0.12);
    color: var(--matcha-dark);
    font-weight: 600;
    font-size: 0.8rem;
    padding: 0.35rem 0.9rem;
    border-radius: 3px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    align-self: flex-start;
    border: 1px solid rgba(122,158,126,0.25);
  }

  .carousel-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-heading);
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
    line-height: 1;
    padding: 0;
  }

  .carousel-btn:hover {
    background: var(--matcha);
    color: white;
    border-color: var(--matcha);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    margin-top: 2rem;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    border: none;
    cursor: pointer;
    transition: background 0.25s, transform 0.2s;
    padding: 0;
  }

  .dot.active {
    background: var(--matcha-dark);
    transform: scale(1.3);
  }

  body.dark .dot { background: #4A3F35; }
  body.dark .dot.active { background: var(--matcha); }

  /* ── MISSION & VALUES ── */
  .mission-section { background: var(--section-green); transition: background var(--transition); }

  .values-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.25rem; }
  .value-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    padding: 1.75rem 1.25rem; text-align: center;
    transition: background var(--transition), border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  }
  .value-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
  .value-icon-wrap {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(122,158,126,0.12);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;
  }
  .value-icon-wrap svg { width: 20px; height: 20px; stroke: var(--matcha-dark); fill: none; stroke-width: 1.8; }
  .value-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; color: var(--text-heading); margin-bottom: 0.45rem; }
  .value-desc { font-size: 0.82rem; color: var(--text-body); line-height: 1.65; }

  /* ── IMPACT STATS ── */
  .stats-section { background: var(--white); transition: background var(--transition); }
  .stats-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
    border: 1px solid var(--card-border); border-radius: var(--radius-md); overflow: hidden;
    transition: border-color var(--transition);
  }
  .stat-item {
    text-align: center; padding: 2.5rem 1rem;
    border-right: 1px solid var(--card-border);
    transition: border-color var(--transition);
  }
  .stat-item:last-child { border-right: none; }
  .stat-number { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 600; color: var(--matcha); line-height: 1; margin-bottom: 0.4rem; display: block; }
  .stat-label  { font-size: 0.78rem; color: var(--text-muted); max-width: 110px; margin: 0 auto; line-height: 1.45; }

  /* ── AUCTIONS ── */
  .auctions-section { background: var(--cream); transition: background var(--transition); }
  .auction-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
  .auction-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);
    transition: transform var(--transition), box-shadow var(--transition), background var(--transition), border-color var(--transition);
  }
  .auction-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
  .auction-card-header {
    height: 180px; position: relative; overflow: hidden;
    display: flex; align-items: flex-end; padding: 1.5rem;
    background: linear-gradient(135deg, var(--espresso) 0%, var(--matcha-dark) 100%);
  }
  .auction-card-header::after { content:''; position:absolute; inset:0; background: linear-gradient(to top, rgba(30,20,15,0.7), transparent); }
  .auction-title { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 600; color: white; position: relative; z-index: 1; }
  .auction-body { padding: 1.5rem; }
  .auction-detail {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.83rem; color: var(--text-body);
    margin-bottom: 0.45rem; transition: color var(--transition);
  }
  .auction-detail svg { width: 13px; height: 13px; flex-shrink: 0; stroke: var(--text-muted); fill: none; stroke-width: 1.7; }
  .tbd-badge {
    display: inline-block; background: var(--section-alt); color: var(--text-body);
    font-family: 'Source Sans 3', sans-serif; font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.3rem 0.75rem; border-radius: 3px; margin: 1rem 0;
    border: 1px solid var(--card-border); transition: background var(--transition), color var(--transition);
  }

  /* ── CAUSES ── */
  .causes-section { background: var(--section-alt); transition: background var(--transition); }
  .causes-notice {
    background: var(--card-bg);
    border-left: 3px solid var(--matcha);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 1rem 1.5rem; margin-bottom: 3rem; max-width: 680px;
    transition: background var(--transition);
  }
  .causes-notice p { font-size: 0.87rem; color: var(--text-body); line-height: 1.7; }
  .causes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.25rem; }
  .cause-card {
    border: 1.5px solid var(--card-border); border-radius: var(--radius-md);
    background: var(--card-bg); padding: 1.75rem;
    transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition), background var(--transition);
  }
  .cause-card:hover { border-color: var(--matcha); transform: translateY(-3px); box-shadow: var(--shadow-sm); }
  .cause-logo-box {
    width: 48px; height: 48px; border-radius: var(--radius-sm);
    background: var(--soft-matcha-light);
    display: flex; align-items: center; justify-content: center; margin-bottom: 1.1rem;
    transition: background var(--transition);
  }
  .cause-logo-box svg { width: 22px; height: 22px; stroke: var(--matcha-dark); fill: none; stroke-width: 1.6; }
  .cause-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 600; color: var(--text-heading); margin-bottom: 0.4rem; }
  .cause-desc { font-size: 0.82rem; line-height: 1.65; color: var(--text-body); }

  /* ── TESTIMONIALS ── */
  .testimonials-section { background: var(--white); overflow: hidden; transition: background var(--transition); }
  .testimonials-wrapper {
    overflow: hidden; position: relative;
    mask-image: linear-gradient(to right, transparent, black 80px, black calc(100% - 80px), transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 80px, black calc(100% - 80px), transparent);
  }
  .testimonials-track { display: flex; gap: 1.25rem; animation: scroll 32s linear infinite; width: max-content; }
  .testimonials-wrapper:hover .testimonials-track { animation-play-state: paused; }
  @keyframes scroll { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }
  .testimonial-card {
    background: var(--cream); border-radius: var(--radius-md);
    padding: 1.75rem; width: 320px; flex-shrink: 0;
    border: 1px solid var(--card-border);
    transition: background var(--transition), border-color var(--transition);
  }
  .testimonial-opener { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--matcha); line-height: 0.9; margin-bottom: 0.8rem; display: block; }
  .testimonial-text   { font-size: 0.875rem; line-height: 1.75; color: var(--text-body); margin-bottom: 1.1rem; font-style: italic; }
  .testimonial-name   { font-size: 0.85rem; font-weight: 600; color: var(--text-heading); }
  .testimonial-role   { font-size: 0.75rem; color: var(--text-muted); }
  .testimonial-avatar-box {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--soft-matcha-light);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background var(--transition);
  }
  .testimonial-avatar-box svg { width: 16px; height: 16px; stroke: var(--matcha-dark); fill: none; stroke-width: 1.6; }
  .testimonial-author { display: flex; align-items: center; gap: 0.7rem; }

  /* ── GET INVOLVED ── */
  .involved-section { background: var(--cream); transition: background var(--transition); }
  .involved-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
  .involved-card {
    border-radius: var(--radius-lg); padding: 2.25rem;
    transition: transform var(--transition), box-shadow var(--transition), background var(--transition), border-color var(--transition);
    border: 1.5px solid transparent;
  }
  .involved-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .involved-card-1 { background: var(--involved-1-bg); border-color: var(--involved-border-1); }
  .involved-card-2 { background: var(--involved-2-bg); border-color: var(--involved-border-2); }
  .involved-card-3 { background: var(--involved-3-bg); border-color: var(--involved-border-3); }
  .involved-card-4 { background: var(--involved-4-bg); border-color: var(--involved-border-4); }
  .involved-icon-wrap {
    width: 44px; height: 44px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.55);
    display: flex; align-items: center; justify-content: center; margin-bottom: 1.2rem;
    transition: background var(--transition);
  }
  body.dark .involved-icon-wrap { background: rgba(255,255,255,0.1); }
  .involved-icon-wrap svg { width: 20px; height: 20px; stroke: var(--matcha-dark); fill: none; stroke-width: 1.7; }
  body.dark .involved-icon-wrap svg { stroke: var(--soft-matcha); }
  .involved-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 600; color: var(--text-heading); margin-bottom: 0.65rem; }
  .involved-desc  { font-size: 0.87rem; color: var(--text-body); line-height: 1.7; margin-bottom: 1.5rem; }

  /* ── FAQ ── */
  .faq-section { background: var(--section-alt); transition: background var(--transition); }
  .faq-list { max-width: 680px; margin: 0 auto; }
  .faq-item { border-bottom: 1px solid var(--card-border); overflow: hidden; transition: border-color var(--transition); }
  .faq-question {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.15rem 0; cursor: pointer;
    font-family: 'Source Sans 3', sans-serif; font-size: 0.95rem; font-weight: 600;
    color: var(--text-heading); transition: color var(--transition); user-select: none;
  }
  .faq-question:hover { color: var(--matcha-dark); }
  .faq-toggle {
    width: 22px; height: 22px; flex-shrink: 0;
    border: 1.5px solid var(--card-border); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 400; color: var(--text-body);
    transition: background var(--transition), border-color var(--transition), transform var(--transition), color var(--transition);
  }
  .faq-item.open .faq-toggle { background: var(--matcha); color: white; border-color: var(--matcha); transform: rotate(45deg); }
  .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s; font-size: 0.875rem; color: var(--text-body); line-height: 1.8; }
  .faq-item.open .faq-answer { max-height: 300px; padding-bottom: 1.25rem; }

  /* ── NEWSLETTER ── */
  .newsletter-section { background: #2A1E18; padding: 5rem 0; text-align: center; min-height: auto; }
  .newsletter-section .eyebrow { color: rgba(255,255,255,0.45); text-align: center; display: block; margin-bottom: 0.5rem; }
  .newsletter
