<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid For Tomorrow — My Bids</title>
    <style>
        /* Shared styles — same as account.html, slightly abbreviated for brevity */
        :root { --crimson:#7D2027; --sand-gold:#FAE3B1; --ochre-gold:#998731; --mahogany:#673C34; --bg-light:#fcf9f6; --card-light:#fff; --text-light:#2c2420; --border-light:#e7dccc; --shadow-light:0 6px 18px rgba(45,35,25,0.06); --bg-dark:#1b1714; --card-dark:#2a2420; --text-dark:#f3ece4; --border-dark:#493f38; --shadow-dark:0 6px 18px rgba(0,0,0,0.35); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg-light); color:var(--text-light); transition:0.3s; display:flex; flex-direction:column; min-height:100vh; }
        body.dark-mode { background:var(--bg-dark); color:var(--text-dark); }
        h1,h2,h3 { font-family:'Playfair Display',serif; font-weight:600; }
        a { color:inherit; text-decoration:none; }
        .container { width:min(1200px,92%); margin:0 auto; }
        .site-header { background:rgba(253,246,238,0.9); backdrop-filter:blur(12px); box-shadow:var(--shadow-light); border-bottom:1px solid var(--border-light); position:sticky; top:0; z-index:50; }
        body.dark-mode .site-header { background:rgba(25,21,18,0.9); border-color:var(--border-dark); }
        .header-inner { display:flex; align-items:center; justify-content:space-between; padding:0.8rem 0; flex-wrap:wrap; gap:0.8rem; }
        .nav-logo { font-size:1.8rem; color:var(--crimson); }
        .nav-links { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; font-weight:500; }
        .nav-links a:hover { color:var(--crimson); }
        .cta-button { background:var(--crimson); color:white; padding:0.5rem 1.3rem; border-radius:50px; font-weight:600; }
        .user-menu { position:relative; display:flex; align-items:center; gap:0.6rem; cursor:pointer; }
        .avatar-icon { width:38px; height:38px; border-radius:50%; background:var(--sand-gold); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--crimson); }
        .dropdown-menu { position:absolute; right:0; top:50px; background:var(--card-light); box-shadow:var(--shadow-light); border-radius:12px; border:1px solid var(--border-light); padding:0.6rem 0; min-width:200px; display:none; }
        body.dark-mode .dropdown-menu { background:var(--card-dark); border-color:var(--border-dark); }
        .dropdown-menu.open { display:block; }
        .dropdown-item { display:flex; align-items:center; gap:10px; padding:0.7rem 1.2rem; cursor:pointer; }
        .dropdown-item:hover { background:#f3e9dc; }
        body.dark-mode .dropdown-item:hover { background:#3a332d; }
        .dark-toggle { background:none; border:1px solid var(--border-light); border-radius:50%; width:38px; height:38px; cursor:pointer; }
        .hamburger { display:none; font-size:1.8rem; background:none; border:none; }
        @media(max-width:768px){ .nav-links{display:none; width:100%; flex-direction:column; align-items:flex-start;} .nav-links.show{display:flex;} .hamburger{display:block;} }
        .card { background:var(--card-light); border-radius:20px; border:1px solid var(--border-light); box-shadow:var(--shadow-light); padding:1.8rem; }
        body.dark-mode .card { background:var(--card-dark); border-color:var(--border-dark); }
        .toast-container { position:fixed; bottom:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
        .toast { padding:1rem 1.5rem; border-radius:10px; background:#2c2420; color:white; animation:slideIn 0.3s; }
        .toast.success { background:#1e7a3c; } .toast.error { background:#b23b3b; }
        @keyframes slideIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none} }
        .empty-state { text-align:center; padding:3rem; color:#888; }
        .badge-status { padding:0.25rem 0.8rem; border-radius:50px; font-size:0.75rem; font-weight:600; }
        .winning{background:#1e7a3c20;color:#1e7a3c} .outbid{background:#b23b3b20;color:#b23b3b} .closed{background:#88888830;color:#666;}
        .bid-row { display:flex; justify-content:space-between; align-items:center; padding:1rem 0; border-bottom:1px solid var(--border-light); }
        body.dark-mode .bid-row { border-color:var(--border-dark); }
        .price { font-weight:700; color:var(--crimson); }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="nav-logo">Bid For Tomorrow</a>
            <button class="hamburger" id="hamburgerBtn">☰</button>
            <nav class="nav-links" id="navLinks">
                <a href="about.html">About Us</a><a href="branches.html">Our Branches</a><a href="auction.html">Fall 26 Auction</a><a href="gallery.html">Gallery</a><a href="events.html">Events</a><a href="how-it-works.html">How It Works</a><a href="impact.html">Impact</a><a href="causes.html">Causes</a><a href="faq.html">FAQ</a><a href="get-involved.html" class="cta-button">Get Involved</a>
            </nav>
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <button class="dark-toggle" id="darkToggle">🌙</button>
                <div class="user-menu" id="userMenu">
                    <div class="avatar-icon" id="avatarDisplay">U</div>
                    <span id="userNameDisplay"></span>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-item" data-link="account.html">👤 My Account</div>
                        <div class="dropdown-item" data-link="my-bids.html">👜 My Bids</div>
                        <div class="dropdown-item" data-link="winning-bids.html">🏆 Winning Bids</div>
                        <div class="dropdown-item" data-link="watchlist.html">❤️ Watchlist</div>
                        <div class="dropdown-item" id="signOutBtn">🚪 Sign Out</div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="container" style="flex:1; padding:2rem 0;">
        <h1>👜 My Bids</h1>
        <div id="bidsContainer" style="margin-top: 1.5rem;"></div>
        <div id="emptyState" class="empty-state" style="display:none;">You haven't placed any bids yet.</div>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://zezgamocqdkqfaqzompd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplemdhbW9jcWRrcWZhcXpvbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA5NzgsImV4cCI6MjEwMzM0Njk3OH0.Wqvn694Nxg1MtF9orvXeCeNTGN2facW-Lxp5T7qzewQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const AUCTION_ID = '101afb93-7d37-4276-8602-026acbda56ed';

        function showToast(msg, type='success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast ${type}`; t.innerText = msg; c.appendChild(t);
            setTimeout(()=>t.remove(),3000);
        }
        // dark & nav toggle similar
        document.getElementById('darkToggle').addEventListener('click', ()=>{ document.body.classList.toggle('dark-mode'); localStorage.setItem('darkMode', document.body.classList.contains('dark-mode')); });
        if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark-mode');
        document.getElementById('hamburgerBtn').addEventListener('click', ()=>document.getElementById('navLinks').classList.toggle('show'));
        const userMenu = document.getElementById('userMenu'); const dropdown = document.getElementById('dropdownMenu');
        userMenu.addEventListener('click', (e)=>{ e.stopPropagation(); dropdown.classList.toggle('open'); });
        document.addEventListener('click', ()=>dropdown.classList.remove('open'));
        document.querySelectorAll('.dropdown-item[data-link]').forEach(el=>el.addEventListener('click', ()=>window.location.href=el.getAttribute('data-link')));
        document.getElementById('signOutBtn').addEventListener('click', async()=>{ await supabase.auth.signOut(); window.location.href='login.html'; });

        async function loadBids() {
            if(!supabase) return;
            const { data: { user } } = await supabase.auth.getUser();
            if(!user) { window.location.href='login.html?redirect=my-bids.html'; return; }
            document.getElementById('avatarDisplay').innerText = user.email?.[0]?.toUpperCase() || 'U';
            document.getElementById('userNameDisplay').innerText = user.user_metadata?.full_name || user.email;
            
            const { data: bids, error } = await supabase
                .from('bids')
                .select('id, lot_id, amount, created_at, lots ( lot_number, artworks ( title, id ) )')
                .eq('bidder_id', user.id)
                .order('created_at', { ascending: false });
            if(error) { showToast('Error loading bids: '+error.message, 'error'); return; }
            const container = document.getElementById('bidsContainer');
            const empty = document.getElementById('emptyState');
            if(!bids || bids.length===0) { container.innerHTML=''; empty.style.display='block'; return; }
            empty.style.display='none';
            container.innerHTML = bids.map(bid => {
                const lot = bid.lots || {};
                const artwork = lot.artworks || {};
                const lotNumber = lot.lot_number || 'N/A';
                const title = artwork.title || 'Unknown artwork';
                const created = new Date(bid.created_at).toLocaleString();
                return `<div class="bid-row">
                    <div><strong>Lot #${lotNumber}</strong> — ${title}</div>
                    <div>$${bid.amount.toLocaleString()} CAD</div>
                    <div>${created}</div>
                    <a href="artwork-detail.html?lot_id=${bid.lot_id}" style="color:var(--crimson);">View</a>
                </div>`;
            }).join('');
        }
        loadBids();
    </script>
</body>
</html>
