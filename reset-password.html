<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://bid4tomorrow.org/reset-password.html">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Bid For Tomorrow</title>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --sand-gold: #FAE3B1;
      --ochre-gold: #998731;
      --terracotta: #CF5527;
      --crimson: #7D2027;
      --crimson-dark: #5C141A;
      --mahogany: #673C34;
      --cream: #FAE3B1;
      --white: #FCF6EC;
      --text-heading: #4E2922;
      --text-body: #59322B;
      --text-muted: #83544C;
      --card-bg: #FCF6EC;
      --input-bg: #FFFFFF;
      --border: #998731;
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --shadow-md: 0 8px 24px rgba(103, 60, 52, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #FAE3B1 0%, #FCF3DF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-md);
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.5rem;
      color: var(--crimson);
      margin-bottom: 0.25rem;
    }

    .logo p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-heading);
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      color: var(--text-body);
      font-size: 0.95rem;
      transition: border-color 0.2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    input:focus {
      outline: none;
      border-color: var(--terracotta);
      box-shadow: 0 0 0 3px rgba(207, 85, 39, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 0.75rem;
      background: var(--crimson);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .btn-primary:hover {
      background: var(--crimson-dark);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      padding: 0.8rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .success-message {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error-message {
      background: #F9E5E5;
      color: #8B3A3A;
    }

    .info-message {
      background: #e3f2fd;
      color: #1976d2;
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .back-link a {
      color: var(--crimson);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    #updatePasswordForm {
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="logo">
      <h1>Bid For Tomorrow</h1>
      <p>Reset your password</p>
    </div>

    <!-- Request Reset Form -->
    <div id="requestResetSection">
      <div class="info-message message" id="infoMessage">
        Enter your email address and we'll send you a password reset link.
      </div>
      <div class="success-message message" id="successMessage">
        Password reset link sent! Check your email.
      </div>
      <div class="error-message message" id="errorMessage"></div>

      <form id="resetRequestForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="your@email.com">
        </div>
        <button type="submit" class="btn-primary" id="resetBtn">Send Reset Link</button>
      </form>
    </div>

    <!-- Update Password Form (shown after clicking reset link) -->
    <div id="updatePasswordSection">
      <div class="error-message message" id="updateErrorMessage"></div>
      <div class="success-message message" id="updateSuccessMessage">
        Password updated successfully! You can now login with your new password.
      </div>

      <form id="updatePasswordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="updateBtn">Update Password</button>
      </form>
    </div>

    <div class="back-link">
      <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script>
    // Initialize Supabase
    const supabaseUrl = 'https://zezgamocqdkqfaqzompd.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplemdhbW9jcWRrcWZhcXpvbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA5NzgsImV4cCI6MjEwMzM0Njk3OH0.Wqvn694Nxg1MtF9orvXeCeNTGN2facW-Lxp5T7qzewQ';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Get elements
    const requestResetSection = document.getElementById('requestResetSection');
    const updatePasswordSection = document.getElementById('updatePasswordSection');
    const resetRequestForm = document.getElementById('resetRequestForm');
    const updatePasswordForm = document.getElementById('updatePasswordForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const infoMessage = document.getElementById('infoMessage');
    const updateErrorMessage = document.getElementById('updateErrorMessage');
    const updateSuccessMessage = document.getElementById('updateSuccessMessage');
    const resetBtn = document.getElementById('resetBtn');
    const updateBtn = document.getElementById('updateBtn');

    // Show info message initially
    infoMessage.style.display = 'block';

    // Handle password reset request
    resetRequestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      
      // Reset messages
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
      
      // Disable button
      resetBtn.disabled = true;
      resetBtn.textContent = 'Sending...';
      
      try {
        const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/reset-password.html'
        });
        
        if (error) throw error;
        
        // Show success message
        successMessage.style.display = 'block';
        successMessage.textContent = 'Password reset link sent! Check your email.';
        
        // Hide form
        resetRequestForm.style.display = 'none';
        
      } catch (error) {
        console.error('Reset error:', error);
        errorMessage.textContent = error.message || 'Failed to send reset link';
        errorMessage.style.display = 'block';
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Send Reset Link';
      }
    });

    // Check if user arrived from reset link
    async function checkForResetSession() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      
      // Check if we have a recovery session
      if (session && session.user?.aud === 'authenticated') {
        // User came from reset link
        requestResetSection.style.display = 'none';
        updatePasswordSection.style.display = 'block';
        updatePasswordForm.style.display = 'block';
        infoMessage.style.display = 'none';
      }
    }

    // Handle password update
    updatePasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Reset messages
      updateErrorMessage.style.display = 'none';
      updateSuccessMessage.style.display = 'none';
      
      // Validate passwords match
      if (newPassword !== confirmPassword) {
        updateErrorMessage.textContent = 'Passwords do not match';
        updateErrorMessage.style.display = 'block';
        return;
      }
      
      // Disable button
      updateBtn.disabled = true;
      updateBtn.textContent = 'Updating...';
      
      try {
        const { data, error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });
        
        if (error) throw error;
        
        // Show success
        updateSuccessMessage.style.display = 'block';
        updatePasswordForm.style.display = 'none';
        
        // Sign out after password update
        await supabaseClient.auth.signOut();
        
        // Redirect to login after 2 seconds
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        
      } catch (error) {
        console.error('Update error:', error);
        updateErrorMessage.textContent = error.message || 'Failed to update password';
        updateErrorMessage.style.display = 'block';
      } finally {
        updateBtn.disabled = false;
        updateBtn.textContent = 'Update Password';
      }
    });

    // Check for reset session on page load
    checkForResetSession();
  </script>
</body>
</html>
