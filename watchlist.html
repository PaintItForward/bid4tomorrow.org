<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid For Tomorrow — Watchlist</title>
    <style>
        :root { --crimson:#7D2027; --sand-gold:#FAE3B1; --ochre-gold:#998731; --mahogany:#673C34; --bg-light:#fcf9f6; --card-light:#fff; --text-light:#2c2420; --border-light:#e7dccc; --shadow-light:0 6px 18px rgba(45,35,25,0.06); --bg-dark:#1b1714; --card-dark:#2a2420; --text-dark:#f3ece4; --border-dark:#493f38; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg-light); color:var(--text-light); transition:0.3s; display:flex; flex-direction:column; min-height:100vh; }
        body.dark-mode { background:var(--bg-dark); color:var(--text-dark); }
        .container { width:min(1200px,92%); margin:0 auto; }
        .site-header { background:rgba(253,246,238,0.9); backdrop-filter:blur(12px); box-shadow:var(--shadow-light); border-bottom:1px solid var(--border-light); position:sticky; top:0; z-index:50; }
        .header-inner { display:flex; align-items:center; justify-content:space-between; padding:0.8rem 0; flex-wrap:wrap; }
        .nav-logo { font-size:1.8rem; color:var(--crimson); }
        .nav-links { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; }
        .cta-button { background:var(--crimson); color:white; padding:0.5rem 1.3rem; border-radius:50px; }
        .user-menu { position:relative; display:flex; align-items:center; gap:0.6rem; cursor:pointer; }
        .avatar-icon { width:38px; height:38px; border-radius:50%; background:var(--sand-gold); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--crimson); }
        .dropdown-menu { position:absolute; right:0; top:50px; background:var(--card-light); box-shadow:var(--shadow-light); border-radius:12px; border:1px solid var(--border-light); padding:0.6rem 0; min-width:200px; display:none; }
        .dropdown-menu.open { display:block; }
        .dropdown-item { display:flex; align-items:center; gap:10px; padding:0.7rem 1.2rem; cursor:pointer; }
        .dark-toggle { background:none; border:1px solid var(--border-light); border-radius:50%; width:38px; height:38px; cursor:pointer; }
        .hamburger { display:none; }
        @media(max-width:768px){ .nav-links{display:none; width:100%;} .nav-links.show{display:flex;} .hamburger{display:block;} }
        .card { background:var(--card-light); border-radius:20px; border:1px solid var(--border-light); box-shadow:var(--shadow-light); padding:1.8rem; margin-bottom:1rem; }
        body.dark-mode .card { background:var(--card-dark); border-color:var(--border-dark); }
        .toast-container { position:fixed; bottom:20px; right:20px; z-index:9999; }
        .toast { padding:1rem 1.5rem; border-radius:10px; background:#2c2420; color:white; margin-top:10px; }
        .empty-state { text-align:center; padding:3rem; color:#888; }
        .watch-item { display:flex; justify-content:space-between; align-items:center; padding:0.8rem 0; border-bottom:1px solid var(--border-light); }
        .remove-btn { background:none; border:none; color:var(--crimson); cursor:pointer; font-weight:600; }
    </style>
</head>
<body>
    <header class="site-header"><div class="container header-inner">
        <a href="index.html" class="nav-logo">Bid For Tomorrow</a>
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <nav class="nav-links" id="navLinks"><a href="about.html">About Us</a><a href="branches.html">Our Branches</a><a href="auction.html">Fall 26 Auction</a><a href="gallery.html">Gallery</a><a href="events.html">Events</a><a href="how-it-works.html">How It Works</a><a href="impact.html">Impact</a><a href="causes.html">Causes</a><a href="faq.html">FAQ</a><a href="get-involved.html" class="cta-button">Get Involved</a></nav>
        <div style="display:flex; gap:0.5rem;"><button class="dark-toggle" id="darkToggle">🌙</button><div class="user-menu" id="userMenu"><div class="avatar-icon" id="avatarDisplay">U</div><span id="userNameDisplay"></span><div class="dropdown-menu" id="dropdownMenu"><div class="dropdown-item" data-link="account.html">👤 My Account</div><div class="dropdown-item" data-link="my-bids.html">👜 My Bids</div><div class="dropdown-item" data-link="winning-bids.html">🏆 Winning Bids</div><div class="dropdown-item" data-link="watchlist.html">❤️ Watchlist</div><div class="dropdown-item" id="signOutBtn">🚪 Sign Out</div></div></div></div>
    </div></header>
    <main class="container" style="flex:1; padding:2rem 0;">
        <h1>❤️ Watchlist</h1>
        <div id="watchlistContainer" style="margin-top:1.5rem;"></div>
        <div id="emptyState" class="empty-state" style="display:none;">Your watchlist is empty. Browse auction lots and tap the heart to save them.</div>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://zezgamocqdkqfaqzompd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplemdhbW9jcWRrcWZhcXpvbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA5NzgsImV4cCI6MjEwMzM0Njk3OH0.Wqvn694Nxg1MtF9orvXeCeNTGN2facW-Lxp5T7qzewQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showToast(msg, type='success') { const c=document.getElementById('toastContainer'); const t=document.createElement('div'); t.className=`toast ${type}`; t.innerText=msg; c.appendChild(t); setTimeout(()=>t.remove(),3000); }
        document.getElementById('darkToggle').addEventListener('click', ()=>{ document.body.classList.toggle('dark-mode'); localStorage.setItem('darkMode', document.body.classList.contains('dark-mode')); });
        if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark-mode');
        document.getElementById('hamburgerBtn').addEventListener('click', ()=>document.getElementById('navLinks').classList.toggle('show'));
        const userMenu=document.getElementById('userMenu'); const dropdown=document.getElementById('dropdownMenu');
        userMenu.addEventListener('click',(e)=>{e.stopPropagation(); dropdown.classList.toggle('open');});
        document.addEventListener('click',()=>dropdown.classList.remove('open'));
        document.querySelectorAll('.dropdown-item[data-link]').forEach(el=>el.addEventListener('click',()=>window.location.href=el.getAttribute('data-link')));
        document.getElementById('signOutBtn').addEventListener('click', async()=>{ await supabase.auth.signOut(); window.location.href='login.html'; });

        async function loadWatchlist() {
            const { data: { user } } = await supabase.auth.getUser();
            if(!user) { window.location.href='login.html?redirect=watchlist.html'; return; }
            document.getElementById('avatarDisplay').innerText = user.email?.[0]?.toUpperCase() || 'U';
            document.getElementById('userNameDisplay').innerText = user.user_metadata?.full_name || user.email;

            const { data: watchlist, error } = await supabase
                .from('watchlist')
                .select('id, lot_id, lots ( lot_number, starting_bid, artworks ( title ) )')
                .eq('user_id', user.id);
            if(error) { showToast('Error loading watchlist: '+error.message, 'error'); return; }
            const container = document.getElementById('watchlistContainer');
            const empty = document.getElementById('emptyState');
            if(!watchlist || watchlist.length===0) { container.innerHTML=''; empty.style.display='block'; return; }
            empty.style.display='none';
            container.innerHTML = watchlist.map(item => {
                const lot = item.lots || {};
                const title = lot.artworks?.title || 'Untitled';
                return `<div class="watch-item">
                    <div>Lot #${lot.lot_number} — ${title}</div>
                    <div><a href="artwork-detail.html?lot_id=${item.lot_id}">View</a> | <button class="remove-btn" data-watchid="${item.id}">Remove</button></div>
                </div>`;
            }).join('');
            document.querySelectorAll('.remove-btn').forEach(btn => btn.addEventListener('click', async (e)=>{
                const watchId = e.target.getAttribute('data-watchid');
                const { error } = await supabase.from('watchlist').delete().eq('id', watchId);
                if(error) showToast('Failed to remove', 'error'); else { showToast('Removed from watchlist', 'success'); loadWatchlist(); }
            }));
        }
        loadWatchlist();
    </script>
</body>
</html>
